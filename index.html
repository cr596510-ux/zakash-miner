<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAKASH MINER</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 25px 18px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 10px auto 15px;
      border-radius: 50%;
      background: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 0 25px rgba(0, 200, 255, 0.25);
    }

    h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .subtitle {
      color: #8d99ae;
      margin-bottom: 25px;
    }

    .balance {
      background: #121a2b;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .balance-title {
      color: #8d99ae;
      font-size: 14px;
    }

    .points {
      font-size: 36px;
      font-weight: bold;
      margin-top: 8px;
    }

    .zksh {
      color: #36d9ff;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 16px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: #1677ff;
      cursor: pointer;
    }

    button:disabled {
      background: #30394a;
      color: #8d99ae;
    }

    .card {
      background: #121a2b;
      border-radius: 18px;
      padding: 18px;
      margin-top: 18px;
      text-align: left;
    }

    .card h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      color: #8d99ae;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">⛏️</div>

  <h1>ZAKASH MINER</h1>
  <div class="subtitle">Mine ZKSH every 24 hours</div>

  <div class="balance">
    <div class="balance-title">YOUR BALANCE</div>
    <div class="points" id="balance">0</div>
    <div class="zksh">ZKSH</div>
  </div>

  <button id="mineBtn" onclick="mine()">
    ⛏️ MINE ZKSH
  </button>

  <div class="card">
    <h2>👥 Invite Friends</h2>
    <p>Invite friends and earn more ZKSH.</p>
    <button onclick="inviteFriends()">Invite Friends</button>
  </div>

  <div class="card">
    <h2>📺 Watch Ad</h2>
    <p>Watch an advertisement and earn bonus ZKSH.</p>
    <button onclick="watchAd()">Watch Ad</button>
  </div>

  <div class="status" id="status"></div>

</div>

<script>
  const tg = window.Telegram.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  let balance = Number(localStorage.getItem("zksh_balance")) || 0;
  let lastMine = Number(localStorage.getItem("zksh_last_mine")) || 0;

  const mineCooldown = 24 * 60 * 60 * 1000;

  function updateUI() {
    document.getElementById("balance").textContent = balance;

    const now = Date.now();
    const remaining = mineCooldown - (now - lastMine);

    const btn = document.getElementById("mineBtn");

    if (lastMine === 0 || remaining <= 0) {
      btn.disabled = false;
      btn.textContent = "⛏️ MINE ZKSH";
      document.getElementById("status").textContent = "";
    } else {
      btn.disabled = true;

      const hours = Math.floor(remaining / 3600000);
      const minutes = Math.floor((remaining % 3600000) / 60000);

      btn.textContent = "⏳ WAIT 24 HOURS";
      document.getElementById("status").textContent =
        "Next mining in " + hours + "h " + minutes + "m";
    }
  }

  function mine() {
    const now = Date.now();

    if (lastMine !== 0 && now - lastMine < mineCooldown) {
      updateUI();
      return;
    }

    const reward = 10;

    balance += reward;
    lastMine = now;

    localStorage.setItem("zksh_balance", balance);
    localStorage.setItem("zksh_last_mine", lastMine);

    document.getElementById("status").textContent =
      "🎉 You mined +" + reward + " ZKSH!";

    updateUI();
  }

  function inviteFriends() {
    const botUsername = "ZakashMinerBot";

    const text =
      "🚀 Join ZAKASH MINER and start mining ZKSH!";

    const url =
      "https://t.me/" + botUsername + "?start=invite";

    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(
        "https://t.me/share/url?url=" +
        encodeURIComponent(url) +
        "&text=" +
        encodeURIComponent(text)
      );
    } else {
      window.open(
        "https://t.me/share/url?url=" +
        encodeURIComponent(url) +
        "&text=" +
        encodeURIComponent(text),
        "_blank"
      );
    }
  }

  function watchAd() {
    document.getElementById("status").textContent =
      "📺 Ads will be connected in a future version.";
  }

  updateUI();

  setInterval(updateUI, 30000);
</script>
<div style="margin-top:20px;">
  <button onclick="alert('🔒 برداشت فعلاً فعال نیست\\nزمان فعال‌شدن بعداً اعلام خواهد شد.')">
    💰 WALLET
  </button>
  <button onclick="alert('🔒 برداشت فعلاً قفل است\\nزمان فعال‌شدن بعداً اعلام خواهد شد.')">
    🔒 WITHDRAW
  </button>
</div>
</body>
</html>
